services:
  zingg_worker:
    build:
      context: ./zingg_worker
      dockerfile: Dockerfile
    container_name: cyber_zingg_worker
    ports:
      - "8001:8001"
    volumes:
      - ./zingg_worker:/app
      - ./data_files:/data_files
      - ./backend/zingg_output_models:/app/zingg_output_models
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: cyber_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=investigation_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  minio:
    image: minio/minio:latest
    container_name: cyber_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  createbuckets:
    image: minio/mc:latest
    container_name: cyber_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/raw-evidence --ignore-existing;
      /usr/bin/mc mb myminio/iceberg-warehouse --ignore-existing;
      exit 0;
      "

  fastapi_backend:
    image: cyber_investigation_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber_investigation_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/investigation_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
      - MINIO_BUCKET_EVIDENCE=raw-evidence
      - MINIO_BUCKET_WAREHOUSE=iceberg-warehouse
      - ENCRYPTION_MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - REDIS_URI=redis://redis:6379/0
      - ZINGG_URL=http://zingg_worker:8001
      - MONGO_URI=mongodb://mongodb:27017
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen2.5:7b-instruct
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - postgres
      - minio
      - neo4j
      - redis
      - zingg_worker
    volumes:
      - ./backend:/app
      - ./data_files:/data_files
    restart: always

  celery_worker:
    image: cyber_investigation_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/investigation_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
      - MINIO_BUCKET_EVIDENCE=raw-evidence
      - MINIO_BUCKET_WAREHOUSE=iceberg-warehouse
      - ENCRYPTION_MASTER_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - REDIS_URI=redis://redis:6379/0
      - ZINGG_URL=http://zingg_worker:8001
      - MONGO_URI=mongodb://mongodb:27017
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen2.5:7b-instruct
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - postgres
      - minio
      - redis
      - neo4j
    volumes:
      - ./backend:/app
      - ./data_files:/data_files
    restart: always

  nextjs_frontend:
    image: cyber_investigation_frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyber_investigation_frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://fastapi_backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: always

  mongodb:
    image: mongo:6.0
    container_name: cyber_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
  neo4j:
    image: neo4j:5.12-community
    container_name: cyber_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_default__advertised__address=127.0.0.1
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    entrypoint: ["/bin/bash", "-c", "rm -f /var/lib/neo4j/run/neo4j.pid && exec /startup/docker-entrypoint.sh neo4j"]
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cyber_redis
    ports:
      - "6379:6379"
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: cyber_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  postgres_data:
  minio_data:
  neo4j_data:
  neo4j_plugins:
  ollama_data:
  mongo_data:
